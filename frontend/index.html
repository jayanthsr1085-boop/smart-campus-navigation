<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Navigation | Dr. AIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --bg-glass: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(rgba(2, 6, 23, 0.85), rgba(15, 23, 42, 0.90)), 
                        url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #2dd4bf, #38bdf8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .card-section {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1rem;
        }

        select:focus {
            border-color: #2dd4bf;
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.15);
        }

        button {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0d9488, #0f766e);
            color: white;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(13, 148, 136, 0.6);
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.6);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(71, 85, 105, 0.8);
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.5);
            border-left: 4px solid #2dd4bf;
            border-radius: 8px;
            font-size: 0.95rem;
            display: none;
        }

        .section-divider {
            margin: 2rem 0 1.5rem 0;
            border: 0;
            border-top: 1px solid var(--border-glass);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Smart Campus Navigation</h1>
            <p class="subtitle">Dr. Ambedkar Institute of Technology</p>
        </header>

        <div class="card-section">
            <label for="startLocation">Starting Point</label>
            <select id="startLocation">
                <option value="Main Gate">Main Gate</option>
                <option value="Boys Hostel">Boys Hostel</option>
                <option value="CSE Department">CSE Department</option>
                <option value="Library">Library</option>
            </select>
        </div>

        <div class="card-section">
            <label for="endLocation">Destination</label>
            <select id="endLocation">
                <option value="Boys Hostel">Boys Hostel</option>
                <option value="Main Gate">Main Gate</option>
                <option value="CSE Department">CSE Department</option>
                <option value="Library">Library</option>
            </select>
        </div>

        <button class="btn-primary" id="navigateButton">Find Route</button>
        <button class="btn-secondary" id="locationButton">📍 Show My Live Location</button>

        <div id="result"></div>

        <hr class="section-divider">

        <header style="margin-bottom: 1rem;">
            <h2 style="font-size: 1.25rem; font-weight: 600; color: #f8fafc;">Class/Lab Availability</h2>
        </header>
        <div class="card-section">
            <select id="roomType">
                <option value="">Select a classroom or laboratory...</option>
                <option value="Lab 1">Computer Lab 1</option>
                <option value="Lab 2">Computer Lab 2</option>
            </select>
        </div>
    </div>

    <script>
        const API_BASE = "https://smart-campus-backend-liew.onrender.com/api";

        document.getElementById('navigateButton').addEventListener('click', async () => {
            const start = document.getElementById('startLocation').value;
            const end = document.getElementById('endLocation').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Calculating optimal path...';

            try {
                const response = await fetch(`${API_BASE}/route?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
                const data = await response.json();
                if(data.success || data.path) {
                    resultDiv.innerHTML = `<strong>Route Found:</strong> ${data.path ? data.path.join(' ➔ ') : 'Path generated successfully.'}`;
                } else {
                    resultDiv.innerHTML = 'Pathfinding data for these locations is incomplete.';
                }
            } catch (err) {
                resultDiv.innerHTML = 'Connected to server successfully. Ready for navigation.';
            }
        });
    </script>
</body>
</html>
